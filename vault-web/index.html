<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vault Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <button id="toggleSidebarButton" class="icon-button small sidebar-toggle" title="Скрыть список заметок" aria-label="Скрыть список заметок">‹</button>
      <div id="sidebarResizeHandle" class="resize-handle sidebar-resize" role="separator" aria-orientation="vertical" title="Изменить ширину списка заметок"></div>
      <div class="topbar">
        <button id="newNoteButton" class="icon-button" title="Новая заметка">+</button>
      </div>
      <input id="searchInput" class="search" placeholder="Поиск по названию или пути" />
      <div id="noteList" class="note-list">
        <div class="status">Загружаю заметки...</div>
      </div>
    </aside>

    <main class="workspace">
      <header class="editor-header">
        <div>
          <div class="title-row">
            <span id="saveStatus" class="save-status saved" title="Сохранено" aria-label="Сохранено"></span>
            <div id="noteTitle" class="note-title">Выбери заметку</div>
          </div>
          <div id="notePath" class="note-path">Markdown-файлы из vault</div>
        </div>
        <div class="actions">
          <button id="themeToggleButton" class="icon-button tool" title="Переключить светлую/темную тему" aria-label="Переключить светлую/темную тему">☾</button>
          <button id="openObsidianButton" class="icon-button tool obsidian-button" title="Открыть текущую заметку в Obsidian" aria-label="Открыть текущую заметку в Obsidian">
            <img src="/assets/obsidian-logo.svg" alt="" />
          </button>
          <button id="modeToggleButton" class="icon-button tool active" title="Переключить Preview/Edit" aria-label="Переключить Preview/Edit">✎</button>
        </div>
      </header>

      <section class="editor-shell">
        <textarea id="editor" spellcheck="true"></textarea>
        <div id="wikiSuggest" class="wiki-suggest hidden"></div>
        <article id="preview" class="preview hidden"></article>
      </section>

      <aside class="links-panel">
        <div id="linksResizeHandle" class="resize-handle links-resize" role="separator" aria-orientation="horizontal" title="Изменить высоту панели ссылок"></div>
        <button id="toggleLinksButton" class="icon-button small links-toggle" title="Скрыть или показать панель ссылок" aria-label="Скрыть или показать панель ссылок">⌄</button>
        <section>
          <h2>Links</h2>
          <div id="outgoingLinks" class="link-list"></div>
        </section>
        <section>
          <h2>Backlinks</h2>
          <div id="backlinks" class="link-list"></div>
        </section>
      </aside>
    </main>

    <dialog id="newNoteDialog">
      <form method="dialog" id="newNoteForm">
        <h2>Новая заметка</h2>
        <label>
          Название
          <input id="newNoteTitle" autofocus />
        </label>
        <label>
          Папка
          <select id="newNoteFolder">
            <option value="Base">Base</option>
            <option value="">Корень vault</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button value="cancel">Отмена</button>
          <button id="createNoteButton" value="default">Создать</button>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script defer src="/main.js"></script>
  </body>
</html>
